# =============================================================================
# Configuração do KMSCON para AURORA NAS
# =============================================================================
# Arquivo: /etc/kmscon/kmscon.conf
# Descrição: Configuração otimizada para true color, aceleração DRM e libinput
# =============================================================================

# =============================================================================
# Seção: General
# =============================================================================
[general]

# Terminal name para detecção de capacidades
term=kmscon

# Habilita 24-bit true color (suporte a 16 milhões de cores)
use-true-color=true

# Fonte padrão (pango será usado se disponível)
font-name=Monospace
font-size=16

# Scrollback buffer
scrollback-size=10000
scrollback-rows=10000

# Cursor
cursor-blink=true
cursor-interval=500

# =============================================================================
# Seção: Graphics (Aceleração e Renderização)
# =============================================================================
[graphics]

# Habilita aceleração por hardware
hwaccel=true

# Usa DRM/KMS para acesso direto ao framebuffer
drm=true

# Seleciona GPU primária
gpus=primary

# Renderizador GL texture (requer GLES2)
render-engine=gltex

# Tamanho do framebuffer (auto-detecta se não especificado)
# fb-width=1920
# fb-height=1080

# Taxa de atualização vsync
vsync=true

# =============================================================================
# Seção: Input (Teclado e Mouse)
# =============================================================================
[input]

# Habilita suporte a libinput (mouse, touchpad)
mouse=true

# Habilita suporte a múltiplos dispositivos de entrada
multi-seat=true

# Grab do teclado (isola do sistema)
grab-keyboard=true

# Grab do mouse
grab-mouse=false

# Configuração do teclado (Brasil ABNT2)
xkb-layout=br
xkb-model=pc105
xkb-variant=abnt2
xkb-options=terminate:ctrl_alt_bksp

# Repetição de teclado
repeat-delay=250
repeat-rate=30

# =============================================================================
# Seção: Session
# =============================================================================
[session]

# Tipo de sessão
session-terminal=enabled

# Comando de login (pode ser customizado)
# login=/bin/login

# Argumentos adicionais para o comando de login
# login-argv=-p

# =============================================================================
# Seção: Video (Configurações específicas de vídeo)
# =============================================================================
[video]

# Habilita suporte a DRM 3D (requer libdrm)
video_drm3d=enabled

# Habilita renderizador GL texture
renderer_gltex=enabled

# Habilita fonte via Pango (melhor renderização de fontes)
font_pango=enabled

# Habilita fonte unifont (fallback para caracteres especiais)
font_unifont=enabled

# =============================================================================
# Seção: Debug (Desabilitado em produção)
# =============================================================================
[debug]

# Debug extra (desabilitado)
extra_debug=false

# Log level (error, warning, notice, info, debug)
log-level=notice

# =============================================================================
# Seção: Fallback
# =============================================================================
# Se DRM/KMS não estiver disponível, o kmscon tentará fbdev automaticamente
# Não é necessário configuração adicional para fallback
