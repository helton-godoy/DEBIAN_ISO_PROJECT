# =============================================================================
# Aurora NAS - Cloud-Init Configuration
# =============================================================================
# Configuração principal do cloud-init para Debian ZFS Live ISO
# =============================================================================

# Identificação do sistema
hostname: debian-zfs-live
fqdn: debian-zfs-live.local

# Configuração de usuários padrão
users:
  - name: admin
    gecos: Aurora NAS Administrator
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys: []

# Configuração SSH
ssh:
  pwauth: true
  authorized_keys: []

# Módulos de inicialização
cloud_init_modules:
  - migrator
  - seed_random
  - bootcmd
  - write_files
  - growpart
  - resizefs
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - ca_certs
  - rsyslog
  - users_groups
  - ssh

cloud_config_modules:
  - mounts
  - locale
  - set_passwords
  - apt_configure
  - ntp
  - timezone
  - disable_ec2_metadata
  - runcmd

cloud_final_modules:
  - package_update_upgrade_install
  - scripts_vendor
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - ssh_authkey_fingerprints
  - keys_to_console
  - phone_home
  - final_message
  - power_state_change

# Configuração do sistema
system_info:
  distro: debian
  default_user:
    name: admin
    lock_passwd: false
    gecos: Aurora NAS Administrator
    groups: [adm, cdrom, dip, plugdev, sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
  network:
    renderers: ['network-manager', 'eni', 'netplan', 'sysconfig']
    activators: ['network-manager', 'eni', 'netplan', 'networkd']

# Mensagem final
final_message: |
  ============================================================================
   Aurora NAS - Debian ZFS Live configurado com sucesso!
  ============================================================================
   Hostname: $HOSTNAME
   Usuários: admin / debian
   Senha padrão: admin / debian
   Acesso SSH: ssh admin@<ip>
   Console: virsh console debian-zfs-live
  ============================================================================

