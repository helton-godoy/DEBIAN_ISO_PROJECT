# =============================================================================
# Configuração ccache Otimizada para Compilação de Módulos DKMS
# =============================================================================
# Descrição: Configurações específicas para caching de compilação de módulos
#            kernel via DKMS, tratando paths absolutos do chroot
# Destino: /etc/dkms/ccache.conf (deve ser copiado para chroot)
# =============================================================================

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES CRÍTICAS PARA DKMS
# -----------------------------------------------------------------------------

# Define diretório base para normalização de paths
# Resolve o problema de paths absolutos do chroot que mudam a cada build
# Todo path abaixo deste será tratado como relativo
base_dir = /var/lib/dkms

# Desabilita hash de diretório no cache
# Importante: evita que mudanças nos paths absolutos do chroot invalidem o cache
# mesmo quando o código fonte é idêntico
no_hash_dir = true

# Permite sloppiness específico para módulos kernel
# include_file_mtime: ignora mudanças no mtime de headers (relevante para kernel headers)
# time_macros: permite que macros de tempo (__TIME__, __DATE__) variem
# pch_defines: necessário para alguns headers pré-compilados do kernel
sloppiness = include_file_mtime, time_macros, pch_defines

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE PERFORMANCE
# -----------------------------------------------------------------------------

# Tamanho máximo do cache (10GB - módulos kernel são grandes)
max_size = 10.0G

# Compressão para reduzir uso de disco
compression = true
compression_level = 6

# Número de níveis de diretório (balanceamento para grandes caches)
cache_dir_levels = 3

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE LOGGING E DEBUG
# -----------------------------------------------------------------------------

# Log file para diagnóstico de cache hits/misses
log_file = /var/cache/dkms-build/ccache/ccache.log

# Estatísticas detalhadas
stats = true

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE COMPILADOR
# -----------------------------------------------------------------------------

# Ignora opções que não afetam o código gerado para módulos kernel
# Estas opções são comumente usadas em builds DKMS mas não alteram o output
ignore_options = -fdebug-prefix-map=* -ffile-prefix-map=* -fmacro-prefix-map=*

# Permite cache mesmo com diferentes versões de GCC se a ABI for compatível
# Útil quando o cache é compartilhado entre builds com atualizações menores do toolchain
check_compiler = true

# -----------------------------------------------------------------------------
# CONFIGURAÇÕES DE SEGURANÇA
# -----------------------------------------------------------------------------

# Não faz cache de compilações com warnings tratados como erro
# Isso evita cache de builds potencialmente problemáticas
disable = false

# -----------------------------------------------------------------------------
# NOTAS SOBRE DKMS
# -----------------------------------------------------------------------------
# 
# Para que o DKMS use esta configuração, as seguintes variáveis devem ser
# exportadas antes da compilação:
#
#   export CCACHE_CONFIGPATH=/etc/dkms/ccache.conf
#   export CC="ccache gcc"
#   export CXX="ccache g++"
#
# Ou configure no framework.conf do DKMS:
#
#   MAKE[0]="make CC='ccache gcc' CXX='ccache g++'"
#
# IMPORTANTE: A variável CCACHE_BASEDIR deve ser configurada dinamicamente
# no hook de build para apontar para o diretório correto do chroot atual.
#