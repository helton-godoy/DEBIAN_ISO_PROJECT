<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ==================================================================== -->
<!-- Configuração Fontconfig para Subpixel Rendering - AURORA NAS         -->
<!-- Arquivo: /etc/fonts/local.conf (ou ~/.config/fontconfig/fonts.conf)  -->
<!-- ==================================================================== -->

<fontconfig>
    <!-- ================================================================= -->
    <!-- Configurações Gerais                                            -->
    <!-- ================================================================= -->

    <!-- Desabilita bitmaps escalados (usa vetor quando disponível) -->
    <match target="font">
        <edit name="scalable" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <!-- Prioriza fontes outline sobre bitmaps -->
    <selectfont>
        <rejectfont>
            <pattern>
                <patelt name="scalable">
                    <bool>false</bool>
                </patelt>
            </pattern>
        </rejectfont>
    </selectfont>

    <!-- ================================================================= -->
    <!-- Subpixel Rendering (RGB)                                        -->
    <!-- ================================================================= -->

    <match target="font">
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
    </match>

    <!-- LCD filter: lcddefault, lcdlight, lcdlegacy -->
    <match target="font">
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
    </match>

    <!-- Hinting: hintnone, hintslight, hintmedium, hintfull -->
    <match target="font">
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
    </match>

    <!-- Antialiasing -->
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <!-- Autohinter (melhor para fontes sem hints nativos) -->
    <match target="font">
        <edit name="autohint" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <!-- ================================================================= -->
    <!-- Substituição de Fontes (Font Families)                          -->
    <!-- ================================================================= -->

    <!-- Sans-serif padrão -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Noto Sans</family>
            <family>DejaVu Sans</family>
            <family>Liberation Sans</family>
            <family>Bitstream Vera Sans</family>
        </prefer>
    </alias>

    <!-- Serif padrão -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Serif</family>
            <family>DejaVu Serif</family>
            <family>Liberation Serif</family>
            <family>Bitstream Vera Serif</family>
        </prefer>
    </alias>

    <!-- Monospace padrão (crucial para terminal) -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Noto Sans Mono</family>
            <family>DejaVu Sans Mono</family>
            <family>Liberation Mono</family>
            <family>Bitstream Vera Sans Mono</family>
            <family>Consolas</family>
            <family>Courier New</family>
        </prefer>
    </alias>

    <!-- ================================================================= -->
    <!-- Tamanhos de Fonte Padrão                                        -->
    <!-- ================================================================= -->

    <match target="pattern">
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="assign">
            <string>monospace</string>
        </edit>
        <edit name="pixelsize" mode="assign">
            <double>16</double>
        </edit>
    </match>

    <!-- ================================================================= -->
    <!-- Configuração Específica para KMSCON                             -->
    <!-- ================================================================= -->

    <!-- Otimização para renderização em framebuffer DRM -->
    <match target="font">
        <test name="family">
            <string>Monospace</string>
        </test>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
    </match>

    <!-- ================================================================= -->
    <!-- DPI (Dots Per Inch)                                             -->
    <!-- ================================================================= -->

    <!-- DPI padrão para displays modernos -->
    <match target="pattern">
        <edit name="dpi" mode="assign">
            <double>96</double>
        </edit>
    </match>

    <!-- ================================================================= -->
    <!-- Cache e Performance                                             -->
    <!-- ================================================================= -->

    <!-- Força re-scan de diretórios de fontes -->
    <dir>/usr/share/fonts</dir>
    <dir>/usr/local/share/fonts</dir>
    <dir prefix="xdg">fonts</dir>

    <!-- Cache de fontes -->
    <cachedir>/var/cache/fontconfig</cachedir>
    <cachedir prefix="xdg">fontconfig</cachedir>

</fontconfig>
